<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Registration Form</title>
</head>
<body>
    <h2>School Registration Form</h2>
    <form action="">
        <label for="First Name">First Name</label>
        <input type="text" name="" id="First name" placeholder="Enter Your First Name" Required><br>
        <label for="Last Name ">Last Name</label>
        <input type="text" name="Last Name" id="Last Name" placeholder="Enter Your Last Name" Required><br>
        <label for="Email">Email</label>
        <input type="email" name="" id="Email" placeholder="Enter Your Email"Required><br>
        <label for="Phone Number">Phone Number</label>
        <input type="tel" name="" id="Phone Number" placeholder="Enter Phone Number" Required><br>
        <label for="Date Of Birth">Date Of Birth</label>
        <input type="date" name="" id="Date Of Birth"><br>
        <label for="Male">Male</label>
        <input type="radio" name="gender" id="Male">
        <label for="Female">Female</label>
        <input type="radio" name="gender" id="Female"><br>
        <label for="Department">Department</label>
        <input type="text" name="Department" id="Department" placeholder="Enter Your Department"><br>
        <input type="radio" name="level" id="100lv">
      <label for="100lv">100lv</label>
       <input type="radio" name="level" id="200lv">
      <label for="200lv">200lv</label>
       <input type="radio" name="level" id="300lv">
      <label for="300lv">300lv</label>
       <input type="radio" name="level" id="400lv">
      <label for="400lv">400lv</label>
        <select name="" id=""><br>
           <option value="">Enter your favourite subject </option>
           <option value="">Mathematics</option>
           <option value="">English</option>
           <option value="">Literature</option> 
           <option value="">CRS</option>
           <option value="">Government</option>
        </select>
        <label for="Matric Number">Matric Number</label>
        <input type="text" name="Matric Number" id="Matric Number" placeholder="Enter Your Matric Number" Required>
        <label for="Communication">Communication</label>
        <input type="checkbox" name="skills" id="Communication">
        <label for="Leadership">Leadership</label>
        <input type="checkbox" name="skills" id="Leadership">
        <label for="Technical">Technical</label>
        <input type="checkbox" name="skills" id="Technical">
        <label for="Problem-Solving">Problem-Solving</label>
        <input type="checkbox" name="skills" id="Problem-Solving">
        <textarea name="Image" id="enter your biography" cols="60" placeholder="Write about yourself"Required></textarea>
        <label for="Image">Image</label>
        <input type="file" name="Image" id="Image" placeholder="">
        <label for="submit"></label>
        <input type="submit" value="submit">
        </form>
    
</body>
</html>
